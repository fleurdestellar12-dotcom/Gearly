<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Formulir Penyewaan - Gearly</title>
</head>
<body>
    <header>
        <h1>Gearly</h1>
        <nav>
            <a href="index.html">Katalog Utama</a> | 
            <a href="detail.html">Detail Perangkat</a>
        </nav>
    </header>

    <main>
        <h2>Formulir Pengajuan Sewa</h2>
        <p>Silakan lengkapi formulir di bawah ini untuk mengajukan penyewaan perangkat.</p>
        
        <form action="#" method="POST">
            <label for="namaLengkap">Nama Lengkap:</label><br>
            <input type="text" id="namaLengkap" name="namaLengkap"><br><br>

            <label for="pilihanPerangkat">Perangkat yang Disewa:</label><br>
            <select id="pilihanPerangkat" name="pilihanPerangkat">
                <option value="kamera">Kamera Digital Profesional</option>
                <option value="racing_wheel">Racing Wheel Simulator</option>
            </select><br><br>

            <label for="durasiSewa">Durasi Sewa (Hari):</label><br>
            <input type="number" id="durasiSewa" name="durasiSewa" min="1"><br><br>

            <label for="catatanTambahan">Catatan / Tujuan Penggunaan:</label><br>
            <textarea id="catatanTambahan" name="catatanTambahan" rows="4" cols="40"></textarea><br><br>

            <input type="submit" value="Kirim Pengajuan Sewa">
        </form>
    </main>

    <footer>
        <p>Dibuat oleh: I Made Radithya Kusuma Wardana (10302240005)</p>
    </footer>
</body>
</html>
